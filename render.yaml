services:
  - type: web
    name: blind-navigator-server
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build -w shared && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CLIENT_ORIGIN
        sync: false
